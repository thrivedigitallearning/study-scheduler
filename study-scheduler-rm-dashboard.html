<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Scheduler RM Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF4F0; --grid:#CFE0D6; --ink:#1E3A34; --ink-soft:#4D6B63; --line:#D3E3DA;
  --card:#FFFFFF; --hi:#CDEBDC; --hi-ink:#1E3A34; --go:#3E9C7A; --go-soft:#DCEFE5; --pen:#C4553F; --pen-soft:#F8E3DD;
  --warn:#9A6A12; --warn-soft:#FAEFD6; --field:#FFFFFF; --focus:#2B7A8C;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121C19; --grid:#22332D; --ink:#E3EFE9; --ink-soft:#9DB8AE; --line:#2C3D37;
    --card:#17241F; --hi:#2F5A4B; --hi-ink:#E3EFE9; --go:#6CCBA5; --go-soft:#1B3A30; --pen:#F08A72; --pen-soft:#3D2420;
    --warn:#E8B85A; --warn-soft:#3A2F17; --field:#101915; --focus:#7FC3D4; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121C19; --grid:#22332D; --ink:#E3EFE9; --ink-soft:#9DB8AE; --line:#2C3D37;
  --card:#17241F; --hi:#2F5A4B; --hi-ink:#E3EFE9; --go:#6CCBA5; --go-soft:#1B3A30; --pen:#F08A72; --pen-soft:#3D2420;
  --warn:#E8B85A; --warn-soft:#3A2F17; --field:#101915; --focus:#7FC3D4; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:radial-gradient(var(--grid) 1.3px,transparent 1.3px); background-size:20px 20px;
  font:16px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 64px}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:800;letter-spacing:-.02em}
h1 .mark{color:var(--go)}
h2{font-size:1.5rem;font-weight:800;margin-bottom:6px}
h3{font-size:1.15rem;font-weight:600;margin-bottom:8px}
h4{font-size:1rem;font-weight:600;margin-bottom:6px}
p{margin:0 0 12px}
.sub{color:var(--ink-soft);max-width:60ch;margin-top:8px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.status{font-size:.85rem;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pen)}
.dot.ok{background:var(--go)}
nav{position:sticky;top:0;z-index:5;background:var(--paper);margin:0 -16px 20px;padding:10px 16px;border-bottom:1.5px solid var(--line);overflow-x:auto;white-space:nowrap}
nav button{font:inherit;font-weight:700;background:none;border:0;color:var(--ink-soft);padding:8px 12px;border-radius:6px;cursor:pointer}
nav button[aria-current="page"]{color:var(--hi-ink);background:var(--hi)}
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}
.lead{max-width:62ch;color:var(--ink-soft);margin-bottom:18px}
.muted{color:var(--ink-soft);font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--ink-soft);flex:1 1 160px;min-width:0}
input,select,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;max-width:100%}
textarea{min-height:72px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{font:inherit;font-weight:700;border-radius:6px;padding:9px 14px;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn.del{border-color:transparent;background:transparent;color:var(--pen);padding:4px 8px}
.btn.link{border:0;background:none;color:var(--focus);padding:0;text-decoration:underline;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{border:2px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--ink-soft)}
.callout{background:var(--hi);color:var(--hi-ink);border-radius:8px;padding:12px 14px;margin-top:12px}
.callout.warn{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.callout p:last-child{margin-bottom:0}
.tag{display:inline-block;font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--grid);color:var(--ink);white-space:nowrap}
.tag.go{background:var(--go-soft);color:var(--ink);border:1px solid var(--go)}
.tag.pen{background:var(--pen-soft);color:var(--pen)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.bar{height:10px;border-radius:5px;background:var(--grid);overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;background:var(--go);transition:width .25s}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:0}
.item .grow{flex:1 1 220px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.9rem;border:1.5px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
footer{margin-top:30px;text-align:center}

/* week */
.weekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.weekbar .ttl{flex:1 1 200px}
.arrow{font:inherit;font-size:1.3rem;font-weight:800;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.stepcard{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.stepcard.done{border-color:var(--go)}
.stepcard.next{border:2.5px solid var(--ink)}
.stepcard .num{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.stepcard.done .num{color:var(--go)}
.stepcard .btn{align-self:flex-start;margin-top:auto}
.crow{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr auto;gap:12px;align-items:center;padding:7px 0}
.daygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dcol{background:var(--field);border:1.5px solid var(--line);border-radius:8px;padding:8px;min-height:90px}
.dcol.today{border:2px solid var(--ink)}
.dcol h4{font-size:.92rem;display:flex;justify-content:space-between;gap:4px;margin:0 0 2px}
.dcol h4 small{font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;color:var(--ink-soft);font-size:.75rem}
.blk{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--focus);border-radius:6px;padding:6px 7px;margin-top:6px;font-size:.82rem;line-height:1.3;overflow-wrap:anywhere}
.blk.logged{border-left-color:var(--go);opacity:.85}
.blk .t{font-weight:700}
.blk .acts{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.blk .acts .btn{padding:2px 8px;font-size:.75rem}
.dcol .none{font-size:.8rem;color:var(--ink-soft);margin-top:4px}
@media (max-width:760px){.daygrid{grid-template-columns:1fr}.dcol{min-height:0}}

/* wizard */
.wiz-steps{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.wiz-steps span{flex:1 1 90px;font-size:.8rem;font-weight:700;color:var(--ink-soft);border-top:4px solid var(--line);padding-top:6px}
.wiz-steps span.on{color:var(--ink);border-top-color:var(--ink)}
.wiz-steps span.past{color:var(--go);border-top-color:var(--go)}
.wiz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.choice button{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:12px;cursor:pointer}
.choice button[aria-pressed="true"]{border:2.5px solid var(--ink);background:var(--hi);color:var(--hi-ink);font-weight:700}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;color:var(--ink-soft)}
.scroll{overflow-x:auto}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,17,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto}
.modal-card{background:var(--card);border-radius:12px;padding:22px;width:100%;max-width:560px;border:1.5px solid var(--line)}

/* RM */
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.scard{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.scard:hover{border-color:var(--ink)}
.scard.attn{border-left:6px solid var(--pen)}
.scard .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.2rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.9rem}
.kv b{font-weight:700;color:var(--ink-soft)}
.quote{border-left:3px solid var(--go);padding-left:10px;margin:4px 0 10px;white-space:pre-wrap}
.quote.note{border-left-color:var(--pen)}
details.wk{border-top:1px solid var(--line);padding:12px 0}
details.wk summary{cursor:pointer;font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mode{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mode button{font:inherit;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:20px;cursor:pointer;color:var(--ink)}
.mode button:hover{border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{nav,.btn,.status,footer{display:none!important}body{background:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Study Scheduler <span class="mark">RM Dashboard</span></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="status" role="status" aria-live="polite"><span class="dot ok" id="dot"></span><span id="saveText">Saved in this browser</span></div>
  </header>
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div class="modal" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitle" id="modalCard"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";

/* ================= constants ================= */
const APP = "scholar-study-scheduler";
const K_S = "sss-scholar-v1", K_R = "sss-rm-v1", K_MODE = "sss-mode";
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const TYPES = ["Exam","Quiz","Assignment","Paper","Project","Lab","Presentation","Other"];
const TESTS = ["Exam","Quiz"];
const PRACTICES = [
  "Self-quizzing or practice test",
  "Practice problems",
  "Flashcards",
  "Explaining it out loud or teaching someone",
  "Summarizing notes from memory",
  "Rereading notes or the textbook",
  "Reading assigned material",
  "Writing or working on a paper or project",
  "Office hours",
  "Tutoring or Tutor.com",
  "Study group",
  "Watching lecture videos",
  "Other"
];
const ACTIVE = new Set(PRACTICES.slice(0,5));
const OBSTACLES = ["Work shifts","Family responsibilities","Putting it off","Phone or social media","Not enough sleep","Too much due at once","The material was confusing","Feeling sick or run down","Plans changed","Other"];
const LENGTHS = [25,30,45,60,90,120];
const GOAL_LABEL = {yes:"Yes, I met my goals", partly:"Partly", no:"No, I fell short"};
const GOAL_SHORT = {yes:"Met goals", partly:"Partly met goals", no:"Missed goals"};

/* ================= helpers ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const str = v => typeof v === "string" ? v.slice(0, 5000) : (typeof v === "number" ? String(v) : "");
const num = v => { const n = parseFloat(v); return isFinite(n) && n >= 0 ? n : 0; };
const arr = v => Array.isArray(v) ? v : [];
const isObj = v => v && typeof v === "object" && !Array.isArray(v);
const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => addDays(d, -((d.getDay()+6)%7));
const wkOf = s => iso(monday(typeof s === "string" ? parse(s) : s));
const thisWk = () => wkOf(today());
const shiftWk = (wk, n) => iso(addDays(parse(wk), 7*n));
const dayDiff = (a,b) => Math.round((a-b)/864e5);
const fmt = d => (typeof d === "string" ? parse(d) : d).toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
const md = d => (typeof d === "string" ? parse(d) : d).toLocaleDateString(undefined,{month:"short", day:"numeric"});
const weekLabel = wk => md(wk) + " to " + md(addDays(parse(wk),6));
const dayDate = (wk, i) => iso(addDays(parse(wk), i));
function hrs(min){ const h = Math.round(min/60*10)/10; return h + (h===1 ? " hr" : " hrs"); }
function hNum(min){ return String(Math.round(min/60*10)/10); }
function t12(hhmm){ if(!hhmm) return ""; const [h,m] = hhmm.split(":").map(Number); return ((h%12)||12) + ":" + pad(m) + (h>=12 ? " PM" : " AM"); }
function mins(n){ return n < 60 ? n + " min" : (n % 60 ? Math.floor(n/60) + " hr " + (n%60) + " min" : (n/60) + (n===60 ? " hr" : " hrs")); }
function load(k, d){ try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch(e){ return d; } }
function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200); }
function armed(btn, label){
  if(btn.dataset.armed) return true;
  btn.dataset.armed = "1"; const orig = btn.textContent; btn.textContent = label || "Tap again to confirm";
  setTimeout(()=>{ if(btn.isConnected && btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = orig; } }, 4000);
  return false;
}
function download(name, text, type){
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type:type||"application/json"})); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000); return true;
  } catch(e){ return false; }
}
async function copy(text){ try { await navigator.clipboard.writeText(text); return true; } catch(e){ return false; } }
const slug = s => String(s||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
function setSaved(ok){ $("#dot").className = "dot" + (ok ? " ok" : ""); $("#saveText").textContent = ok ? "Saved in this browser" : "Couldn't save. Download a backup now."; }

/* ================= data model ================= */
function blankScholar(){ return {id: uid()+uid(), profile:{name:"", school:"", rm:""}, courses:[], deadlines:[], weeks:{}, lastBackup:"", lastSent:""}; }
function blankWeek(){ return {goals:{}, blocks:[], sessions:[], planned:false, plannedAt:"", reflection:null}; }
function normRef(r){
  if(!isObj(r)) return null;
  return {goalMet: ["yes","partly","no"].includes(r.goalMet) ? r.goalMet : "", helped:str(r.helped), wentWell:str(r.wentWell),
    obstacles: arr(r.obstacles).map(str).filter(Boolean).slice(0,12), obstacleNote:str(r.obstacleNote), change:str(r.change), rmNote:str(r.rmNote), at:str(r.at)};
}
function normScholar(o){
  const b = blankScholar(); if(!isObj(o)) return b;
  if(typeof o.id === "string" && o.id) b.id = o.id.slice(0,40);
  if(isObj(o.profile)) ["name","school","rm"].forEach(k=>b.profile[k] = str(o.profile[k]).slice(0,120));
  b.courses = arr(o.courses).filter(isObj).map(c=>({id:str(c.id)||uid(), name:str(c.name).slice(0,120), credits:num(c.credits), goal:num(c.goal)})).slice(0,30);
  b.deadlines = arr(o.deadlines).filter(d=>isObj(d) && isDate(d.date)).map(d=>({id:str(d.id)||uid(), courseId:str(d.courseId), course:str(d.course).slice(0,120), title:str(d.title).slice(0,200), type: TYPES.includes(d.type) ? d.type : "Other", date:d.date, done:!!d.done, ready: Math.min(5, Math.round(num(d.ready)))})).slice(0,600);
  if(isObj(o.weeks)) Object.keys(o.weeks).filter(isDate).slice(0,400).forEach(k=>{
    const w = o.weeks[k]; if(!isObj(w)) return; const nw = blankWeek();
    if(isObj(w.goals)) Object.keys(w.goals).slice(0,30).forEach(c=>nw.goals[c] = num(w.goals[c]));
    nw.blocks = arr(w.blocks).filter(isObj).map(x=>({id:str(x.id)||uid(), day: Math.max(0, Math.min(6, Math.round(num(x.day)))), courseId:str(x.courseId), course:str(x.course).slice(0,120), minutes: num(x.minutes)||30, time: /^\d{2}:\d{2}$/.test(x.time||"") ? x.time : "", practice:str(x.practice).slice(0,80)})).slice(0,120);
    nw.sessions = arr(w.sessions).filter(x=>isObj(x) && isDate(x.date)).map(x=>({id:str(x.id)||uid(), date:x.date, courseId:str(x.courseId), course:str(x.course).slice(0,120), minutes: num(x.minutes), practice:str(x.practice).slice(0,80), focus:str(x.focus).slice(0,20), note:str(x.note).slice(0,500), planId:str(x.planId)})).slice(0,300);
    nw.planned = !!w.planned; nw.plannedAt = str(w.plannedAt); nw.reflection = normRef(w.reflection);
    b.weeks[k] = nw;
  });
  b.lastBackup = str(o.lastBackup); b.lastSent = str(o.lastSent);
  return b;
}
const wkData = (st, wk) => st.weeks[wk] || null;
function wkMake(st, wk){ if(!st.weeks[wk]) st.weeks[wk] = blankWeek(); return st.weeks[wk]; }
function cname(st, id, fallback){ const c = st.courses.find(x=>x.id===id); return c ? (c.name || "Untitled class") : (fallback || "Other"); }
function goalsFor(st, wk){
  const w = wkData(st, wk); const g = {};
  if(w && Object.keys(w.goals).length){ Object.assign(g, w.goals); st.courses.forEach(c=>{ if(!(c.id in g)) g[c.id] = c.goal; }); }
  else st.courses.forEach(c=>g[c.id] = c.goal);
  return g;
}
function stats(st, wk){
  const w = wkData(st, wk) || blankWeek();
  const goals = goalsFor(st, wk);
  const ids = new Set(Object.keys(goals).filter(k=>goals[k] > 0));
  w.blocks.forEach(b=>ids.add(b.courseId||"other:"+b.course)); w.sessions.forEach(s=>ids.add(s.courseId||"other:"+s.course));
  const rows = [...ids].map(id=>{
    const fb = (w.sessions.find(s=>(s.courseId||"other:"+s.course)===id)||w.blocks.find(b=>(b.courseId||"other:"+b.course)===id)||{}).course;
    return {id, name: cname(st, id, fb), goal: goals[id]||0,
      planned: w.blocks.filter(b=>(b.courseId||"other:"+b.course)===id).reduce((a,b)=>a+b.minutes,0),
      logged: w.sessions.filter(s=>(s.courseId||"other:"+s.course)===id).reduce((a,s)=>a+s.minutes,0)};
  }).sort((a,b)=>b.goal-a.goal || a.name.localeCompare(b.name));
  const goalRows = rows.filter(r=>r.goal>0);
  const practices = {}; w.sessions.forEach(s=>{ const p = s.practice||"Not recorded"; practices[p] = (practices[p]||0) + s.minutes; });
  const end = iso(addDays(parse(wk),6));
  const dls = st.deadlines.filter(d=>d.date >= wk && d.date <= end).sort((a,b)=>a.date.localeCompare(b.date));
  const loggedAll = w.sessions.reduce((a,s)=>a+s.minutes,0);
  const activeMin = w.sessions.filter(s=>ACTIVE.has(s.practice)).reduce((a,s)=>a+s.minutes,0);
  return {w, rows, goalRows, goalMin: goalRows.reduce((a,r)=>a+r.goal*60,0), planned: w.blocks.reduce((a,b)=>a+b.minutes,0), logged: loggedAll,
    met: goalRows.length>0 && goalRows.every(r=>r.logged >= r.goal*60 - 0.5), metCount: goalRows.filter(r=>r.logged >= r.goal*60 - 0.5).length,
    practices, days: new Set(w.sessions.map(s=>s.date)).size, sessions: w.sessions.length, dls, activeMin};
}
function blockLogged(w, b){ return w.sessions.some(s=>s.planId===b.id); }
function weeksWithData(st){ return Object.keys(st.weeks).filter(k=>{ const w = st.weeks[k]; return w.planned || w.sessions.length || w.blocks.length || w.reflection; }).sort().reverse(); }

const PLAN_STEPS = ["My classes","What's due","When I'll study","Review"];
const REF_STEPS = ["My numbers","My deadlines","What worked","Next week"];
function startPlan(wk){ wkMake(S, wk); wiz = {type:"plan", wk, step:0, sel:new Set()}; viewWk = wk; render(); window.scrollTo({top:0}); }
function startReflect(wk){
  const w = wkMake(S, wk); const r = w.reflection;
  wiz = {type:"reflect", wk, step:0, d: r ? JSON.parse(JSON.stringify(r)) : {goalMet:"", helped:"", wentWell:"", obstacles:[], obstacleNote:"", change:"", rmNote:""}};
  viewWk = wk; render(); window.scrollTo({top:0});
}
function vWiz(){
  if(wiz.type === "done") return vRefDone();
  const steps = wiz.type === "plan" ? PLAN_STEPS : REF_STEPS;
  const body = wiz.type === "plan" ? [vP0,vP1,vP2,vP3][wiz.step]() : [vR0,vR1,vR2,vR3][wiz.step]();
  const last = wiz.step === steps.length-1;
  return `<div class="sheet">
    <div class="item" style="padding-top:0;margin-bottom:6px"><span class="muted" style="font-weight:700">${wiz.type==="plan" ? "Plan my week" : "Reflect on my week"}: ${weekLabel(wiz.wk)}</span><button class="btn ghost small" id="wzExit">Save and exit</button></div>
    <div class="wiz-steps">${steps.map((s,i)=>`<span class="${i===wiz.step ? "on" : i<wiz.step ? "past" : ""}">${i+1}. ${s}</span>`).join("")}</div>

    <div class="wiz-nav">${wiz.step ? `<button class="btn ghost" id="wzBack">Back</button>` : "<span></span>"}<button class="btn" id="wzNext">${last ? (wiz.type==="plan" ? "Save my plan" : "Submit my reflection") : "Next"}</button></div>
  </div>`;
}
function bindWiz(){
  const m = $("#main");
  if(wiz.type === "done"){ bindRefDone(); return; }
  $("#wzExit", m).addEventListener("click", ()=>{ if(wiz.type==="reflect") toast("Your reflection isn't submitted yet. Finish it any time."); wiz = null; view = "week"; render(); });
  const bk = $("#wzBack", m); if(bk) bk.addEventListener("click", ()=>{ wiz.step--; render(); window.scrollTo({top:0}); });
  $("#wzNext", m).addEventListener("click", ()=>{
    const err = (wiz.type==="plan" ? [cP0,cP1,cP2,cP3] : [cR0,cR1,cR2,cR3])[wiz.step]();
    if(err){ $("#wzErr", m).textContent = err; return; }
    const steps = wiz.type === "plan" ? PLAN_STEPS : REF_STEPS;
    if(wiz.step < steps.length-1){ wiz.step++; render(); window.scrollTo({top:0}); return; }
    if(wiz.type === "plan"){
      const w = wkMake(S, wiz.wk); w.planned = true; w.plannedAt = new Date().toISOString(); save();
      wiz = null; view = "week"; render(); window.scrollTo({top:0}); toast("Your plan is saved. Log each session as you go.");
    } else {
      const w = wkMake(S, wiz.wk); w.reflection = Object.assign({}, wiz.d, {at:new Date().toISOString()}); save();
      wiz = {type:"done", wk:wiz.wk}; render(); window.scrollTo({top:0});
    }
  });
  (wiz.type==="plan" ? [bP0,bP1,bP2,bP3] : [bR0,bR1,bR2,bR3])[wiz.step](m);
}

/* ---- plan step 0: classes ---- */
function vP0(){

/* ================= RM ================= */
function normRoster(o){
  const r = {scholars:{}}; if(!isObj(o) || !isObj(o.scholars)) return r;
  Object.keys(o.scholars).slice(0,300).forEach(id=>{ const e = o.scholars[id]; if(isObj(e) && isObj(e.data)){ const d = normScholar(e.data); r.scholars[d.id] = {sent:str(e.sent), loaded:str(e.loaded), data:d}; } });
  return r;
}
function ingest(text){
  let o; try { o = JSON.parse(String(text).trim()); } catch(e){ return "bad"; }
  if(!o || o.app!==APP) return "bad";
  if(o.kind === "rm-roster"){ const rr = normRoster(o.roster); let n = 0; Object.values(rr.scholars).forEach(e=>{ const cur = R.scholars[e.data.id]; if(!cur || e.sent > cur.sent){ R.scholars[e.data.id] = e; n++; } }); return "roster:" + n; }
  const src = o.kind==="report" ? o.scholar : o.kind==="backup" ? o.state : null; if(!isObj(src)) return "bad";
  const d = normScholar(src); const sent = str(o.sent || o.exported) || new Date().toISOString();
  const cur = R.scholars[d.id];
  if(cur && cur.sent >= sent) return "old";
  R.scholars[d.id] = {sent, loaded:new Date().toISOString(), data:d};
  return cur ? "updated" : "added";
}
function rmSummary(e){
  const st = e.data, cw = thisWk(), pw = shiftWk(cw,-1);
  const cs = stats(st, cw), cwd = wkData(st, cw);
  const reflected = Object.keys(st.weeks).filter(k=>st.weeks[k].reflection).sort().reverse();
  const lastRef = reflected[0] ? {wk:reflected[0], r:st.weeks[reflected[0]].reflection} : null;
  const sentDay = e.sent ? parse(e.sent.slice(0,10)) : null;
  const since = sentDay ? dayDiff(today(), sentDay) : 999;
  const t = iso(today()), t14 = iso(addDays(today(),14));
  const tests = st.deadlines.filter(d=>TESTS.includes(d.type) && d.date >= t && d.date <= t14).sort((a,b)=>a.date.localeCompare(b.date));
  const flags = [];
  if(since > 8) flags.push({t:"No update in " + since + " days", w:3});
  const sentThisWk = e.sent && e.sent.slice(0,10) >= cw;
  if(sentThisWk && !(cwd && cwd.planned)) flags.push({t:"No plan for this week", w:2});
  if(reflected.length >= 2 && st.weeks[reflected[0]].reflection.goalMet !== "yes" && st.weeks[reflected[1]].reflection.goalMet !== "yes") flags.push({t:"Short of study goals 2 weeks in a row", w:2});
  else if(lastRef && lastRef.r.goalMet === "no") flags.push({t:"Missed study goals last time", w:1});
  const pwd = wkData(st, pw);
  if(e.sent && e.sent.slice(0,10) >= cw && pwd && (pwd.planned || pwd.sessions.length) && !pwd.reflection) flags.push({t:"Skipped last week's reflection", w:1});
  if(lastRef && lastRef.r.rmNote) flags.push({t:"Left you a note", w:2, note:true});
  const lowReady = st.deadlines.filter(d=>TESTS.includes(d.type) && d.ready && d.ready <= 2 && d.date >= iso(addDays(today(),-14)));
  if(lowReady.length) flags.push({t:"Felt unprepared for a recent " + lowReady[0].type.toLowerCase(), w:1});
  return {cs, cwd, lastRef, since, tests, flags, score: flags.reduce((a,f)=>a+f.w,0), sentThisWk};
}

    : `<div class="empty"><p><b>No scholars yet.</b></p><p style="margin:0">Share the Scholar Study Scheduler file (scholar-study-scheduler.html) with your scholars. Each week they'll tap <b>Share &amp; back up → Download my update</b> and send you the file. Load those files above.</p></div>`}

      <p class="muted" style="margin-top:10px">To load a roster backup, choose it with "Update files" above.</p></div>` : ""}`;
}

          ${pr.length ? `<div class="kv"><b>Study methods</b><span>${pr.map(([pp,mn])=>esc(pp) + " (" + hNum(mn) + "h)").join(", ")}</span></div>` : ""}
          ${ws.dls.length ? `<h4 style="margin-top:12px">Due that week</h4>${ws.dls.map(d=>`<div class="item"><span class="grow">${d.done ? "✓ " : ""}<b>${esc(d.title)}</b> <span class="muted">${esc(cname(st,d.courseId,d.course))}, ${esc(d.type)}, ${fmt(d.date)}</span></span>${d.ready ? `<span class="tag ${d.ready<=2 ? "pen" : "go"}">Prepared: ${d.ready}/5</span>` : ""}${!d.done && d.date < t ? `<span class="tag warn">Not checked off</span>` : ""}</div>`).join("")}` : ""}
          ${r ? `<h4 style="margin-top:14px">Reflection</h4>
            <div class="kv"><b>Met goals?</b><span>${esc(GOAL_LABEL[r.goalMet]||"")}</span><b>Helped most</b><span>${esc(r.helped)}</span><b>Got in the way</b><span>${esc(r.obstacles.join(", ") || "Nothing selected")}</span></div>
            ${r.wentWell ? `<div class="muted" style="margin-top:8px;font-weight:700">What went well</div><div class="quote">${esc(r.wentWell)}</div>` : ""}
            ${r.obstacleNote ? `<div class="muted" style="font-weight:700">More about what got in the way</div><div class="quote">${esc(r.obstacleNote)}</div>` : ""}
            ${r.change ? `<div class="muted" style="font-weight:700">Change for next week</div><div class="quote">${esc(r.change)}</div>` : ""}
            ${r.rmNote ? `<div class="muted" style="font-weight:700">Note to RM</div><div class="quote note">${esc(r.rmNote)}</div>` : ""}` : ""}
        </details>`; }).join("") : `<div class="empty">This scholar hasn't planned any weeks yet.</div>`}
    </div>`;
}
function bindRmDetail(id){
  const m = $("#main");
  $("#rmBack", m).addEventListener("click", ()=>{ rmSel = null; render(); });
  $("#rmDel", m).addEventListener("click", e=>{ if(!armed(e.target, "Tap again to remove")) return; delete R.scholars[id]; saveR(); rmSel = null; msg = "Scholar removed."; render(); });
  $("#rmNotes", m).addEventListener("click", async ()=>{
    const e = R.scholars[id], st = e.data, s = rmSummary(e); const k = s.lastRef ? s.lastRef.wk : weeksWithData(st)[0];
    let t = "Study Scheduler update: " + (st.profile.name||"Scholar") + " (sent " + (e.sent ? e.sent.slice(0,10) : "?") + ")\n";
    if(k){ const ws = stats(st,k), r = ws.w.reflection;
      t += "Week of " + weekLabel(k) + ": planned " + hNum(ws.planned) + " hrs, logged " + hNum(ws.logged) + " of " + hNum(ws.goalMin) + " hr goal, " + ws.sessions + " sessions on " + ws.days + " days.\n";
      if(r){ t += "Met goals: " + (GOAL_SHORT[r.goalMet]||"") + "\nHelped most: " + r.helped + "\nWent well: " + r.wentWell + "\nGot in the way: " + (r.obstacles.join(", ") || "none") + (r.obstacleNote ? " (" + r.obstacleNote + ")" : "") + "\nChange next week: " + r.change + "\n" + (r.rmNote ? "Note to RM: " + r.rmNote + "\n" : ""); }
    }
    if(s.tests.length) t += "Upcoming tests: " + s.tests.map(d=>cname(st,d.courseId,d.course) + " " + d.type + " " + d.date).join("; ") + "\n";
    if(await copy(t)) toast("Summary copied"); else toast("Couldn't copy in this browser");
  });
}

/* ================= boot ================= */
render();
})();
</script>
</body>
</html>
